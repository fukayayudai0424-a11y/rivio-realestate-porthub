<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>お問い合わせ | Rivio不動産</title>
    <meta name="description" content="Rivio不動産へのお問い合わせ。LINE相談とフォーム相談の2チャネル。" />
    <link rel="stylesheet" href="./assets/css/styles.css" />
  </head>
  <body class="subpage">
    <header class="site-header"><a href="./index.html" class="site-logo"><span class="site-logo__mark">R</span><span class="site-logo__text">Rivio不動産<small>REAL ESTATE</small></span></a></header>
    <button class="burger" data-burger aria-label="メニュー" aria-expanded="false"><span></span></button>
    <nav class="nav-drawer" data-drawer><a href="./buy.html">買いたい</a><a href="./rent.html">借りたい</a><a href="./sell.html">売りたい</a><a href="./owner.html">貸したい</a><a href="./about.html">会社案内</a><a href="./recruit.html">採用情報</a><a href="./contact.html">お問い合わせ</a></nav>
    <main>
      <section class="page-hero">
        <div class="container">
          <div class="page-hero__en">CONTACT</div>
          <div class="page-hero__jp">お問い合わせ</div>
          <p class="page-hero__lead">買う・借りる・売る・貸す、どのご相談でも対応します。まずはお気軽にどうぞ。</p>
        </div>
      </section>
      <section class="content-block content-block--tint">
        <div class="container contact-grid">
          <div class="contact-line" style="padding:0;overflow:hidden;background:var(--white);color:var(--ink);text-align:left">
            <img src="./assets/img/photo-consultation.png" alt="ご相談風景" style="width:100%;aspect-ratio:16/10;object-fit:cover" loading="lazy" />
            <div style="padding:2.4rem">
              <h3 style="font-size:2rem;font-weight:900;color:var(--navy)">LINEで相談</h3>
              <p style="margin:1.2rem 0 2rem;font-size:1.4rem;color:#556">最新物件情報や相談予約をすぐ受け取れます。<br />平日 9:00–19:00 対応</p>
              <a href="#" style="display:inline-block;background:#06c755;color:#fff;font-weight:700;padding:1.2rem 3rem;border-radius:999px">LINE相談を始める</a>
            </div>
          </div>
          <div class="form-box">
            <h3 style="font-size:2rem;font-weight:900;margin-bottom:2rem;color:var(--navy)">メールフォーム</h3>
            <form data-contact-form>
              <div class="form-group"><label for="name">お名前<span class="req">必須</span></label><input id="name" name="name" required /></div>
              <div class="form-group"><label for="email">メール<span class="req">必須</span></label><input id="email" type="email" required /></div>
              <div class="form-group"><label for="phone">電話番号</label><input id="phone" type="tel" /></div>
              <div class="form-group"><label for="type">種別<span class="req">必須</span></label>
                <select id="type" required><option value="">選択</option><option>買いたい</option><option>借りたい</option><option>売りたい</option><option>貸したい</option><option>採用</option></select>
              </div>
              <div class="form-group"><label for="msg">内容<span class="req">必須</span></label><textarea id="msg" rows="5" required></textarea></div>
              <div class="form-group"><label><input type="checkbox" data-consent /> <a href="./privacy.html">プライバシーポリシー</a>に同意</label></div>
              <button class="form-submit" type="submit" data-submit>送信する</button>
              <div class="form-message" data-message></div>
            </form>
          </div>
        </div>
      </section>
    </main>
    <footer class="site-footer"><div class="container footer-bottom">&copy; Rivio不動産</div></footer>
    <script src="./assets/js/main.js"></script>
  </body>
</html>
